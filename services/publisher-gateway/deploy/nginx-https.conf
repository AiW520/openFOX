server {
    listen 80;
    listen [::]:80;
    server_name op.47.107.92.13.nip.io;
    location /.well-known/acme-challenge/ { root /var/www/opentu-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name op.47.107.92.13.nip.io;
    ssl_certificate /etc/letsencrypt/live/op.47.107.92.13.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/op.47.107.92.13.nip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/opentu-publisher/current/dist/apps/web;
    index index.html;
    client_max_body_size 64m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=86400" always;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    location /api/publisher/ {
        proxy_pass http://127.0.0.1:7211;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
        proxy_buffering off;
        proxy_cache off;
    }
    location ~ ^/publisher(?:/|$) {
        proxy_pass http://127.0.0.1:7211;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ /\. { deny all; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    # Recover relative asset URLs in app shells cached before release 1.1.24.
    location ^~ /workflow/canvas/assets/ {
        rewrite ^/workflow/canvas/assets/(.*)$ /assets/$1 last;
    }
    location /assets/ { try_files $uri =404; expires 7d; }
    location /workflow-assets/ { try_files $uri =404; expires 7d; }
    location / { try_files $uri $uri/ /index.html; }
}
